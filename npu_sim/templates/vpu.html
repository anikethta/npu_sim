<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  color-scheme: light;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f7f8fb;
  color: #17202a;
}
body { margin: 0; padding: 24px; }
main { max-width: 980px; margin: 0 auto; }
h1 { font-size: 24px; margin: 0 0 16px; }
.toolbar, .summary { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
button { border: 1px solid #b8c2d2; border-radius: 6px; background: #fff; min-width: 40px; min-height: 34px; cursor: pointer; }
button:hover { background: #edf2f7; }
input[type="range"] { width: 280px; }
.layout { display: grid; grid-template-columns: 1fr 320px; gap: 18px; }
.panel { border: 1px solid #b8c2d2; border-radius: 8px; background: #fff; padding: 12px; }
.stages { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 8px; }
.stage { min-height: 96px; border: 1px solid #b8c2d2; border-radius: 8px; background: #fbfdff; padding: 8px; }
.stage.active { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.18); }
.stage.requant.active { border-color: #7c3aed; box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.18); }
.stage-name { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
.item { border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc; padding: 4px 5px; font-size: 11px; line-height: 1.25; overflow-wrap: anywhere; }
.requant .item { border-color: #ddd6fe; background: #f5f3ff; color: #312e81; }
.empty { color: #64748b; font-size: 12px; }
@media (max-width: 760px) { body { padding: 12px; } .layout { grid-template-columns: 1fr; } .stages { grid-template-columns: 1fr; } input[type="range"] { width: 100%; } }
</style>
</head>
<body>
<main>
  <h1>__TITLE__</h1>
  <div class="summary" id="summary"></div>
  <div class="toolbar">
    <button id="prev" title="Previous cycle">Prev</button>
    <button id="play" title="Play or pause">Play</button>
    <button id="next" title="Next cycle">Next</button>
    <label>Cycle <input id="cycle" type="range" min="0" value="0"></label>
    <span id="cycleLabel"></span>
    <label>Speed <input id="speed" type="range" min="100" max="2000" value="1000"></label>
  </div>
  <div class="layout">
    <section class="panel"><div class="stages" id="stages"></div></section>
    <aside class="panel">
      <h2>Cycle Events</h2>
      <div id="eventList"></div>
    </aside>
  </div>
</main>
<script id="trace-data" type="application/json">__TRACE_JSON__</script>
<script>
const result = JSON.parse(document.getElementById("trace-data").textContent);
const trace = result.trace || [];
const maxCycle = Math.max(result.current_cycle || 0, ...trace.map(e => e.cycle || 0));
let cycle = 0;
let timer = null;
const stageDefs = [
  ["vpu_instruction_fetch", "Instruction SRAM"],
  ["vpu_input_accept", "Input"],
  ["vpu_pass_through", "SIMD Pass"],
  ["vpu_output_emit", "Output"],
  ["requant_multiply", "Multiply"],
  ["requant_round", "Round"],
  ["requant_shift", "Shift"],
  ["requant_saturate", "Saturate"],
];
const stages = document.getElementById("stages");
for (const [eventName, label] of stageDefs) {
  const stage = document.createElement("div");
  stage.className = eventName.startsWith("requant_") ? "stage requant" : "stage";
  stage.id = `stage-${eventName}`;
  stage.innerHTML = `<div class="stage-name">${label}</div><div class="items"></div>`;
  stages.appendChild(stage);
}
document.getElementById("summary").textContent =
  `array size ${result.size}x${result.size} | batches ${result.batch_count || 1} | final cycle ${result.current_cycle}`;
const cycleInput = document.getElementById("cycle");
cycleInput.max = String(maxCycle);
const cycleLabel = document.getElementById("cycleLabel");
const eventList = document.getElementById("eventList");
function formatEvent(e) {
  const where = e.row === null || e.col === null ? "" : ` PE(${e.row},${e.col})`;
  const batch = e.batch === null || e.batch === undefined ? "" : ` batch=${e.batch}`;
  const value = e.value === null || e.value === undefined ? "" : ` value=${e.value}`;
  let requant = "";
  if (e.requantization) {
    const r = e.requantization;
    requant = ` M_o=${r.scale_multiplier} shift=${r.shift} target=${r.target_kind}${r.target_bits}`;
  }
  return `${e.event}${batch}${where}${value}${requant}`;
}
function render() {
  cycleInput.value = String(cycle);
  cycleLabel.textContent = `${cycle} / ${maxCycle}`;
  document.querySelectorAll(".stage").forEach(stage => {
    stage.className = stage.id.includes("requant_") ? "stage requant" : "stage";
    stage.querySelector(".items").innerHTML = "";
  });
  const events = trace.filter(e => e.cycle === cycle);
  for (const event of events) {
    const stage = document.getElementById(`stage-${event.event}`);
    if (!stage) continue;
    stage.classList.add("active");
    const item = document.createElement("div");
    item.className = "item";
    item.textContent = formatEvent(event);
    stage.querySelector(".items").appendChild(item);
  }
  document.querySelectorAll(".stage").forEach(stage => {
    const items = stage.querySelector(".items");
    if (!items.children.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Idle";
      items.appendChild(empty);
    }
  });
  eventList.innerHTML = events.length
    ? events.map(e => `<div>${formatEvent(e)}</div>`).join("")
    : "<div>No events</div>";
}
document.getElementById("prev").onclick = () => { cycle = Math.max(0, cycle - 1); render(); };
document.getElementById("next").onclick = () => { cycle = Math.min(maxCycle, cycle + 1); render(); };
cycleInput.oninput = () => { cycle = Number(cycleInput.value); render(); };
document.getElementById("play").onclick = () => {
  const play = document.getElementById("play");
  if (timer) {
    clearInterval(timer);
    timer = null;
    play.textContent = "Play";
    return;
  }
  play.textContent = "Pause";
  timer = setInterval(() => {
    cycle = cycle >= maxCycle ? 0 : cycle + 1;
    render();
  }, Number(document.getElementById("speed").value));
};
render();
</script>
</body>
</html>
